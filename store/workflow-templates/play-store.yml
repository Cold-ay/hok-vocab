name: Prepare Play Store release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/**', 'release.config.json', 'package*.json', '.github/workflows/play-store.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run release:android:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-unsigned
          path: releases/play-store/
          if-no-files-found: error
          retention-days: 14
